[project]
name = "qoro-pyscf"
version = "0.6.1"
description = "PySCF examples on divi"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Qoro Quantum Ltd.", email = "team@qoroquantum.de"},
]
keywords = [
    "quantum", "chemistry", "VQE", "PySCF", "Qoro", "GPU",
    "CASCI", "CASSCF", "quantum computing", "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "qoro-divi[chem]",
    "pyscf>=2.14",
    "scipy",
    "numpy",
    "qoro-maestro",
]

[project.optional-dependencies]
notebook = [
    "jupyter",
    "matplotlib",
]

[project.urls]
Homepage = "https://qoroquantum.de"
Documentation = "https://qoroquantum.github.io/maestro/d7/d01/python_guide.html"
Repository = "https://github.com/QoroQuantum/qoro-pyscf"
Issues = "https://github.com/QoroQuantum/qoro-pyscf/issues"

[tool.uv]
package = false
constraint-dependencies = ["fonttools<4.69"]

[tool.uv.sources]
qoro-divi = { path = "../divi", editable = true }
